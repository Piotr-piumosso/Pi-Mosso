<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Più Mosso – licznik</title>

<style>
body{
  margin:0;
  background:#0c0a08;
  color:#f6f0e4;
  font-family:system-ui,-apple-system,Segoe UI,Inter,Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.box{
  max-width:420px;
  width:100%;
  padding:24px;
  border:1px solid rgba(197,165,87,.3);
  border-radius:14px;
  background:#12100d;
}
h1{
  margin:0 0 12px;
  font-size:20px;
}
p{
  margin:6px 0;
  font-size:14px;
  color:rgba(246,240,228,.75);
}
input,button{
  width:100%;
  padding:10px 12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid rgba(197,165,87,.35);
  background:#0c0a08;
  color:#f6f0e4;
  font-size:15px;
}
button{
  cursor:pointer;
}
button:hover{
  background:#18140f;
}
.hidden{
  display:none;
}
.stat{
  margin-top:14px;
  font-size:14px;
}
.small{
  font-size:12px;
  color:rgba(246,240,228,.6);
}
</style>
</head>

<body>

<div class="box" id="login">
  <h1>Dostęp prywatny</h1>
  <p>Podaj PIN, aby wejść.</p>
  <input id="pin" type="password" placeholder="PIN">
  <button onclick="check()">Wejdź</button>
  <p id="err" class="small hidden">Zły PIN.</p>
</div>

<div class="box hidden" id="panel">
  <h1>Statystyki – Più Mosso</h1>
  <p class="stat">Liczba wejść na tę stronę:</p>
  <p class="stat"><strong><span id="count">0</span></strong></p>
  <p class="small">Ostatnie wejście:</p>
  <p class="small" id="last">—</p>
</div>

<script>
const PIN = "2137";

function check(){
  const v = document.getElementById("pin").value;
  if(v === PIN){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    enter();
  }else{
    document.getElementById("err").classList.remove("hidden");
  }
}

function enter(){
  let c = localStorage.getItem("pm_counter");
  c = c ? parseInt(c,10)+1 : 1;
  localStorage.setItem("pm_counter", c);

  const d = new Date().toLocaleString("pl-PL");
  localStorage.setItem("pm_last", d);

  document.getElementById("count").textContent = c;
  document.getElementById("last").textContent = d;
}
</script>

</body>
</html>
