<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- blokada indeksowania -->
  <meta name="robots" content="noindex, nofollow" />

  <title>Più Mosso — Statystyki</title>

  <style>
    :root{
      --bg:#0C0A08;
      --panel:#12100D;
      --ink:#F6F0E4;
      --muted:rgba(246,240,228,.72);
      --gold:#C5A557;
      --border:rgba(197,165,87,.22);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial;
      line-height:1.45;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:28px 16px 40px;
    }
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }
    h1{
      margin:0;
      font-size:20px;
      font-weight:600;
      letter-spacing:.02em;
    }
    .sub{
      margin-top:6px;
      font-size:13px;
      color:var(--muted);
    }
    .hint{
      border:1px solid var(--border);
      background:rgba(197,165,87,.06);
      padding:10px 12px;
      border-radius:12px;
      font-size:12.5px;
      color:var(--muted);
      max-width:520px;
    }
    .card{
      border:1px solid var(--border);
      background:var(--panel);
      border-radius:16px;
      overflow:hidden;
    }
    iframe{
      width:100%;
      height:78vh;
      min-height:520px;
      border:0;
      background:var(--panel);
    }
    .footer{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
    }
    .pill{
      display:inline-block;
      padding:3px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      font-size:12px;
      margin-right:6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Statystyki — Più Mosso</h1>
        <div class="sub">
          Widok prywatny • brak linków • tylko bezpośredni adres
        </div>
      </div>
      <div class="hint">
        <span class="pill">noindex</span>
        Ta strona nie jest widoczna publicznie ani w menu.
      </div>
    </header>

    <div class="card">
      <!-- TU WSTAWIASZ LINK DO DASHBOARDU -->
      <!-- Plausible / Simple Analytics / GoatCounter -->
      <iframe
        src="WSTAW_TUTAJ_LINK_DO_DASHBOARDU"
        loading="lazy"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
      </iframe>
    </div>

    <div class="footer">
      Wejście wyłącznie przez: <span class="pill">/licznik/</span><br>
      Jeśli kiedykolwiek będziesz chciał pełne hasło → Cloudflare Access.
    </div>
  </div>
</body>
</html>
