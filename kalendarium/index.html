<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>Kalendarium — Più Mosso</title>
<meta name="description" content="Kalendarium koncertów Più Mosso — wybrane wydarzenia i nadchodzące terminy." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --paper:#ECE8DD;
  --paper2:#E3DECF;
  --ink:#201F1A;
  --ink-soft:rgba(32,31,26,.72);
  --ink-faint:rgba(32,31,26,.5);
  --rule:#B7AD96;
  --rule-soft:rgba(183,173,150,.42);
  --accent:#4B5A43;
  --max:1100px;
  --r:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Source Serif 4",Charter,Georgia,serif;
  font-size:17px; line-height:1.75;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--ink);border-bottom:1px solid var(--rule)}
a:hover{color:var(--accent);border-color:var(--accent)}
h1{font-family:"Bodoni Moda",Didot,Georgia,serif;font-style:italic;font-weight:500}
h1{font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1.08}
h2{font-family:"Bodoni Moda",Didot,Georgia,serif;font-style:normal;font-weight:600;font-size:1.3rem;color:var(--accent);margin-top:26px}
.container{max-width:var(--max);margin:0 auto;padding:88px 20px 60px}
.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule-soft);
  padding-bottom:18px;margin-bottom:22px;
}
.top a{border:1px solid var(--ink);border-radius:var(--r);padding:9px 16px;font-family:"Archivo",Arial,sans-serif;font-size:.8rem;font-weight:600}
.top a:hover{background:var(--ink);color:var(--paper);opacity:1}
.smallcaps{font-family:"Archivo",Arial,sans-serif;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.card{
  border:1px solid var(--rule);
  padding:22px 24px;
}
.event{display:grid;gap:10px}
.event .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:.95rem;font-family:"Archivo",Arial,sans-serif}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--rule);
  padding:4px 10px;border-radius:var(--r);
  font-family:"Archivo",Arial,sans-serif;
  font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}
.list{display:grid;gap:14px;margin-top:14px}
.footer{margin-top:32px;color:var(--ink-faint);font-family:"Archivo",Arial,sans-serif;font-size:.82rem}
.footer a{border:none}
.note{color:var(--ink-soft)}

/* Galeria w kartach */
.photos{
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:10px;
  margin-top:10px;
}
@media(max-width:860px){ .photos{grid-template-columns:repeat(2, minmax(0,1fr));} }
@media(max-width:480px){ .photos{grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;} }

.photo{
  display:block;
  overflow:hidden;
  border:1px solid var(--rule);
}
.photo:hover{border-color:var(--accent)}
.photo img{
  width:100%;
  height:160px;
  object-fit:cover;
  display:block;
  filter:saturate(.92) contrast(1.02);
}
@media(max-width:480px){ .photo img{height:140px;} }
</style>
</head>

<body>
  <div class="container">
    <div class="top">
      <div>
        <div class="smallcaps">Più Mosso</div>
        <h1>Kalendarium</h1>
      </div>
      <div>
        <a href="/" aria-label="Powrót na stronę główną">Powrót</a>
      </div>
    </div>

    <p style="color:var(--ink-soft)">
      Wybrane koncerty Più Mosso
    </p>

    <h2>Wydarzenia</h2>
    <div class="list" id="events"></div>

    <div class="footer">
      Kontakt: <a href="mailto:kontakt@piumosso.pl">kontakt@piumosso.pl</a>
    </div>
  </div>

<script>
function formatPL(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString("pl-PL",{day:"2-digit",month:"long",year:"numeric"});
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function photosHTML(arr, altBase){
  const a=(arr||[]).filter(Boolean);
  if(!a.length) return "";
  return `<div class="photos" aria-label="Galeria zdjęć">${a.map(fn=>`
    <a class="photo" href="${esc(fn)}" target="_blank" rel="noopener">
      <img src="${esc(fn)}" alt="${esc(altBase)}" loading="lazy" decoding="async">
    </a>`).join("")}</div>`;
}
function renderEvents(events){
  const today = new Date().toISOString().slice(0,10);
  const wrap = document.getElementById("events");
  wrap.innerHTML = "";
  const sorted = [...events].sort((a,b)=>b.date.localeCompare(a.date));
  // Nadchodzące (upcoming) na górze
  const upcoming = sorted.filter(e => e.date >= today);
  const past     = sorted.filter(e => e.date <  today);
  if(upcoming.length){
    const lbl = document.createElement("h2");
    lbl.textContent = "Nadchodzące";
    wrap.appendChild(lbl);
    upcoming.forEach(e => wrap.appendChild(makeCard(e)));
  }
  if(past.length){
    const lbl = document.createElement("h2");
    lbl.style.marginTop = upcoming.length ? "32px" : "0";
    lbl.textContent = "Archiwum";
    wrap.appendChild(lbl);
    past.forEach(e => wrap.appendChild(makeCard(e)));
  }
}
function makeCard(e){
  const place = `${e.city}${e.venue && e.venue!=="—" ? " • "+e.venue : ""}`;
  const el = document.createElement("div");
  el.className = "card event";
  el.innerHTML = `
    <div class="meta">
      <span class="badge">${formatPL(e.date)}</span>
      <span>${esc(place)}</span>
    </div>
    <div style="font-family:'Bodoni Moda',Georgia,serif;font-size:1.25rem;line-height:1.25;color:var(--ink)">${esc(e.title)}</div>
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    ${photosHTML(e.photos||[], `${e.title} (${formatPL(e.date)})`)}
  `;
  return el;
}
// Załaduj z JSON (cache-bust co godzinę)
const ts = Math.floor(Date.now()/3600000);
fetch(`../data/calendar.json?t=${ts}`)
  .then(r => r.json())
  .then(renderEvents)
  .catch(() => { document.getElementById("events").innerHTML = '<p style="color:var(--ink-faint)">Nie udało się załadować kalendarza.</p>'; });
</script>
</body>
</html>
