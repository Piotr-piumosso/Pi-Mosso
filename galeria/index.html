<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<title>Galeria — Più Mosso</title>
<meta name="description" content="Galeria zdjęć Più Mosso." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --paper:#ECE8DD;
  --ink:#201F1A;
  --ink-soft:rgba(32,31,26,.72);
  --ink-faint:rgba(32,31,26,.5);
  --rule:#B7AD96;
  --rule-soft:rgba(183,173,150,.42);
  --accent:#4B5A43;
  --max:1200px;
  --r:2px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Source Serif 4",Charter,Georgia,serif;
  font-size:17px; line-height:1.7;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
a:hover{color:var(--accent);border-color:var(--accent)}

h1{
  font-family:"Bodoni Moda",Didot,Georgia,serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(2.4rem,4.5vw,3.4rem);
  line-height:1.05;
}

.container{
  max-width:var(--max);
  margin:0 auto;
  padding:88px 20px 70px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:1px solid var(--rule-soft);
  padding-bottom:18px;
  margin-bottom:28px;
  gap:18px;
  flex-wrap:wrap;
}

.smallcaps{
  font-family:"Archivo",Arial,sans-serif;
  font-size:.72rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:700;
}

.top a{border:1px solid var(--ink);border-radius:var(--r);padding:9px 16px;font-family:"Archivo",Arial,sans-serif;font-size:.8rem;font-weight:600}
.top a:hover{background:var(--ink);color:var(--paper);opacity:1}

/* ===== GALERIA (MASONRY, BEZ CIĘCIA) ===== */
.gallery{
  column-count:2;
  column-gap:28px;
}

@media(max-width:900px){
  .gallery{column-count:1}
}

.photo{
  break-inside:avoid;
  margin:0 0 28px;
}

.photo img{
  width:100%;
  height:auto;               /* KLUCZ: pełny kadr, bez cropu */
  display:block;
  border:1px solid var(--rule);
  filter:saturate(.92) contrast(1.02);
}

.caption{
  margin-top:10px;
  font-size:.9rem;
  color:var(--ink-faint);
  display:flex;
  justify-content:flex-end;
}

.caption span{
  font-family:"Archivo",Arial,sans-serif;
  font-style:normal;
  letter-spacing:.03em;
  color:var(--ink-faint);
}

.footer{
  margin-top:54px;
  padding-top:18px;
  border-top:1px solid var(--rule-soft);
  font-family:"Archivo",Arial,sans-serif;
  font-size:.82rem;
  color:var(--ink-faint);
}
.footer a{border:none}
</style>
</head>

<body>
  <div class="container">

    <div class="top">
      <div>
        <div class="smallcaps">Più Mosso</div>
        <h1>Galeria</h1>
      </div>
      <a href="/">Powrót</a>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="footer">kontakt@piumosso.pl</div>

  </div>

<script>
/*
  Zdjęcia są w /galeria/
  Każde zdjęcie = osobny obiekt z autorem (i tylko to pokazujemy)
*/

const PHOTOS = [
  { file:"IMG_0531.jpeg", author:"fot. N. Zhang" },
  { file:"IMG_0532.jpeg", author:"fot. N. Zhang" },

  { file:"IMG_0764.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0769.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0771.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0775.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0781.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0785.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0787.jpeg", author:"fot. R. Szwarc" },

  { file:"IMG_3404.jpeg", author:"fot. własne" },
  { file:"IMG_3412.jpeg", author:"fot. własne" },
  { file:"IMG_4826.jpeg", author:"fot. własne" }
];

const wrap=document.getElementById("gallery");

PHOTOS.forEach(p=>{
  const fig=document.createElement("figure");
  fig.className="photo";
  fig.innerHTML=`
    <img src="${p.file}" alt="${p.author}" loading="lazy" decoding="async">
    <figcaption class="caption"><span>${p.author}</span></figcaption>
  `;
  wrap.appendChild(fig);
});

/* Sprawdzenie rozdzielczości (wypis do konsoli, bez wpływu na wygląd) */
window.addEventListener("load", () => {
  document.querySelectorAll(".photo img").forEach(img => {
    if (img.complete) {
      console.log(`[GALERIA] ${img.getAttribute("src")} — ${img.naturalWidth}×${img.naturalHeight}px`);
    } else {
      img.addEventListener("load", () => {
        console.log(`[GALERIA] ${img.getAttribute("src")} — ${img.naturalWidth}×${img.naturalHeight}px`);
      });
    }
  });
});
</script>
</body>
</html>
