<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<title>Galeria — Più Mosso</title>
<meta name="description" content="Galeria zdjęć Più Mosso." />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#0C0A08; --bg-2:#080605;
  --ink:#F6F0E4; --muted:rgba(246,240,228,.68);
  --gold:#C5A557;
  --line:rgba(197,165,87,.22);
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --radius:14px;
  --max:1200px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Inter",sans-serif;
  font-size:17px; line-height:1.7;
  background:
    radial-gradient(1200px 650px at 50% -15%, rgba(197,165,87,.10), transparent 60%),
    linear-gradient(180deg, var(--bg), var(--bg-2));
  color:var(--ink);
}

a{color:var(--gold);text-decoration:none}

h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(2.3rem,4.5vw,3.3rem);
  line-height:1.1;
}

.container{
  max-width:var(--max);
  margin:0 auto;
  padding:92px 20px 70px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:34px;
}

.smallcaps{
  font-size:.75rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ===== GALERIA ===== */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:28px;
}

@media(max-width:900px){
  .gallery{grid-template-columns:1fr}
}

.photo{
  position:relative;
}

.photo img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

@media(max-width:600px){
  .photo img{height:300px}
}

.caption{
  margin-top:10px;
  font-size:.95rem;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.caption span:last-child{
  font-style:italic;
  color:rgba(246,240,228,.55);
}

.footer{
  margin-top:60px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-size:.9rem;
  color:var(--muted);
}
</style>
</head>

<body>
  <div class="container">

    <div class="top">
      <div>
        <div class="smallcaps">Più Mosso</div>
        <h1>Galeria</h1>
      </div>
      <a href="/">Powrót</a>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="footer">
      kontakt@piumosso.pl
    </div>

  </div>

<script>
/*
  Zdjęcia są w /galeria/
  Każde zdjęcie = osobny obiekt z autorem
*/

const PHOTOS = [
  { file:"IMG_0531.jpeg", author:"fot. N. Zhang" },
  { file:"IMG_0532.jpeg", author:"fot. N. Zhang" },

  { file:"IMG_0764.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0769.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0771.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0775.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0781.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0785.jpeg", author:"fot. R. Szwarc" },
  { file:"IMG_0787.jpeg", author:"fot. R. Szwarc" }
];

const wrap=document.getElementById("gallery");

PHOTOS.forEach(p=>{
  const el=document.createElement("figure");
  el.className="photo";
  el.innerHTML=`
    <img src="${p.file}" alt="Più Mosso — ${p.author}" loading="lazy">
    <figcaption class="caption">
      <span>Più Mosso</span>
      <span>${p.author}</span>
    </figcaption>
  `;
  wrap.appendChild(el);
});
</script>
</body>
</html>
